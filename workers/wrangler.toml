name = "mll-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# MY LATINO LIST - CLOUDFLARE WORKER CONFIGURATION
# ============================================================
#
# Production stays untouched.
# Staging is isolated for MLL 2.0 development.
# ============================================================

# ── Default / Production KV ─────────────────────────────────
[[kv_namespaces]]
binding = "SESSION_CACHE"
id = "8934635b28204b7eb3b58566bd97af43"
preview_id = "c2e71408090c483091c3fc07a2c4501f"

# ── Default / Production R2 ─────────────────────────────────
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mll-media"
preview_bucket_name = "mll-media-dev"

# ── Default / Production Variables ─────────────────────────
[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://mylatinolist.io"
SUPABASE_URL = "https://jhjdhmjkcnjtbojocjam.supabase.co"

# ── Production Secrets ─────────────────────────────────────
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_KEY
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# RESEND_API_KEY
# ALGOLIA_APP_ID
# ALGOLIA_ADMIN_KEY
# FB_PAGE_ACCESS_TOKEN
# ADMIN_TEST_TOKEN

# ── Cron Triggers ──────────────────────────────────────────
[triggers]
crons = ["0 10 * * *", "0 9 * * 1"]

# ── Production Route ───────────────────────────────────────
[[routes]]
pattern = "api.mylatinolist.io/*"
zone_name = "mylatinolist.io"

# ============================================================
# PRODUCTION
# ============================================================

[env.production]
name = "mll-api-production"

[env.production.vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://mylatinolist.io"
SUPABASE_URL = "https://jhjdhmjkcnjtbojocjam.supabase.co"

[[env.production.kv_namespaces]]
binding = "SESSION_CACHE"
id = "8934635b28204b7eb3b58566bd97af43"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "mll-media"

# ============================================================
# STAGING / MLL 2.0 DEVELOPMENT
# ============================================================

[env.staging]
name = "mll-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
FRONTEND_URL = "https://staging.mylatinolist.pages.dev"

# Placeholder on purpose.
# Replace with the new DEV Supabase project URL before deployment.
SUPABASE_URL = "https://YOUR-DEV-SUPABASE-PROJECT.supabase.co"

[[env.staging.kv_namespaces]]
binding = "SESSION_CACHE"
id = "878fc40235fe4681a940a82a72042481"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "mll-media-dev"