name = "mll-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# MY LATINO LIST - CLOUDFLARE WORKER CONFIGURATION
# ============================================================
#
# PRODUCTION
#   Frontend:  https://mylatinolist.io
#   API:       https://api.mylatinolist.io
#   Worker:    mll-api
#   Supabase:  Production
#   KV:        Production
#   R2:        mll-media
#
# STAGING / MLL 2.0
#   Frontend:  https://staging.mylatinolist.pages.dev
#   Worker:    mll-api-staging
#   Supabase:  mll-dev
#   KV:        Dedicated staging namespace
#   R2:        mll-media-dev
#
# IMPORTANT:
# Never place Supabase secret/service keys in this file.
# Store secrets using Wrangler.
# ============================================================


# ============================================================
# DEFAULT / PRODUCTION RESOURCES
# ============================================================

# ── Production KV ───────────────────────────────────────────

[[kv_namespaces]]
binding = "SESSION_CACHE"
id = "8934635b28204b7eb3b58566bd97af43"
preview_id = "c2e71408090c483091c3fc07a2c4501f"


# ── Production R2 ───────────────────────────────────────────

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mll-media"
preview_bucket_name = "mll-media-dev"


# ── Default Production Variables ────────────────────────────

[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://mylatinolist.io"
SUPABASE_URL = "https://jhjdhmjkcnjtbojocjam.supabase.co"
MLL_AI_ENABLED = "false"

# Default (no --env) stays AI-disabled.
# Production AI is enabled only under [env.production].


# ============================================================
# SECRETS
# ============================================================
#
# Secrets are NOT stored in wrangler.toml.
#
# Production examples:
#
# npx wrangler secret put SUPABASE_ANON_KEY --env production
# npx wrangler secret put SUPABASE_SERVICE_KEY --env production
# npx wrangler secret put STRIPE_SECRET_KEY --env production
# npx wrangler secret put STRIPE_WEBHOOK_SECRET --env production
# npx wrangler secret put RESEND_API_KEY --env production
# npx wrangler secret put ALGOLIA_APP_ID --env production
# npx wrangler secret put ALGOLIA_ADMIN_KEY --env production
# npx wrangler secret put FB_PAGE_ACCESS_TOKEN --env production
# npx wrangler secret put ADMIN_TEST_TOKEN --env production
#
#
# Staging examples:
#
# npx wrangler secret put SUPABASE_ANON_KEY --env staging
# npx wrangler secret put SUPABASE_SERVICE_KEY --env staging
#
# Additional staging secrets should use TEST/DEV credentials:
#
# npx wrangler secret put STRIPE_SECRET_KEY --env staging
# npx wrangler secret put STRIPE_WEBHOOK_SECRET --env staging
# npx wrangler secret put RESEND_API_KEY --env staging
# npx wrangler secret put ALGOLIA_APP_ID --env staging
# npx wrangler secret put ALGOLIA_ADMIN_KEY --env staging
# npx wrangler secret put FB_PAGE_ACCESS_TOKEN --env staging
# npx wrangler secret put ADMIN_TEST_TOKEN --env staging
#
# IMPORTANT:
# Stripe staging must use Stripe TEST MODE credentials.
# ============================================================


# ============================================================
# CRON TRIGGERS
# ============================================================

[triggers]
crons = []


# ============================================================
# PRODUCTION API ROUTE
# ============================================================

[[routes]]
pattern = "api.mylatinolist.io/*"
zone_name = "mylatinolist.io"


# ============================================================
# PRODUCTION ENVIRONMENT
# ============================================================

[env.production]
name = "mll-api"


# ── Production Variables ────────────────────────────────────

[env.production.vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://mylatinolist.io"
SUPABASE_URL = "https://jhjdhmjkcnjtbojocjam.supabase.co"
MLL_AI_ENABLED = "true"


# ── Production Workers AI (do not copy staging KV/R2/Supabase) ──

[env.production.ai]
binding = "AI"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "mll_marketing_events"


# ── Production API route ────────────────────────────────────
# Same hostname already owned by Worker mll-api. Deploy --env
# production onto that existing Worker; do not create a second
# Worker name for this route.

[[env.production.routes]]
pattern = "api.mylatinolist.io/*"
zone_name = "mylatinolist.io"


# ── Production cron (same schedule as current production) ───

[env.production.triggers]
crons = [
  "0 10 * * *",
  "0 9 * * 1"
]


# ── Production KV ───────────────────────────────────────────

[[env.production.kv_namespaces]]
binding = "SESSION_CACHE"
id = "8934635b28204b7eb3b58566bd97af43"


# ── Production R2 ───────────────────────────────────────────

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "mll-media"


# ============================================================
# STAGING / MLL 2.0 DEVELOPMENT ENVIRONMENT
# ============================================================

[env.staging]
name = "mll-api-staging"
workers_dev = true
# Do not inherit the production api.mylatinolist.io route.
routes = []


# ── Staging Variables ───────────────────────────────────────

[env.staging.vars]

ENVIRONMENT = "staging"
MLL_AI_ENABLED = "true"

# Cloudflare Pages staging frontend
FRONTEND_URL = "https://staging.mylatinolist.pages.dev"

# Dedicated MLL DEV Supabase project (mll-dev)
# Must never equal the production project jhjdhmjkcnjtbojocjam
SUPABASE_URL = "https://bjtfrmkhishoadjtpzgg.supabase.co"


# ── Staging Workers AI (keep isolated from production KV/R2/DB) ──

[env.staging.ai]
binding = "AI"

[[env.staging.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "mll_marketing_events"


# ── Staging KV ──────────────────────────────────────────────
#
# Dedicated staging namespace.
# DO NOT replace this with the production KV ID.
#

[[env.staging.kv_namespaces]]
binding = "SESSION_CACHE"
id = "878fc40235fe4681a940a82a72042481"


# ── Staging R2 ──────────────────────────────────────────────
#
# Dedicated development media bucket (mll-media-dev).
# There is no public custom domain on this bucket.
# Staging uploads return {Worker origin}/api/media/{key} and the
# Worker streams GET/HEAD from this binding. Production still uses
# https://media.mylatinolist.io and bucket mll-media — do not change that.
#

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "mll-media-dev"
