      </div>
    </div>

<script>
const API = window.MLL_CONFIG.API_URL;

function clearAuthSession() {
  sessionStorage.removeItem('mll_token');
  sessionStorage.removeItem('mll_user_id');
  sessionStorage.removeItem('mll_business_id');
}

function showExistingSession(label) {
  const box = document.getElementById('existing-session');
  const fields = document.getElementById('login-form-fields');
  document.getElementById('existing-session-label').textContent = label;
  box.style.display = 'block';
  if (fields) fields.style.display = 'none';
}

function showLoginForm() {
  const box = document.getElementById('existing-session');
  const fields = document.getElementById('login-form-fields');
  if (box) box.style.display = 'none';
  if (fields) fields.style.display = 'block';
}

(function identifyExistingSession() {
  const existing = sessionStorage.getItem('mll_token');
  if (!existing) return;
  fetch(`${API}/api/auth/me`, { headers: { Authorization: `Bearer ${existing}` } })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(d => {
      const email = d?.user?.email || d?.profile?.email || '';
      const biz = window.MLL_CURRENT_BUSINESS.resolveAssignedBusiness(d).business;
      const bizName = biz?.name || '';
      showExistingSession(bizName && email ? `${email} · ${bizName}` : (email || bizName || 'your account'));
    })
    .catch(() => {
      clearAuthSession();
      showLoginForm();
    });
})();

function loginReturnTarget() {
  return window.MLL_SAFE_RETURN.loginReturnFromSearch(window.location.search);
}

document.getElementById('continue-session-btn').addEventListener('click', () => {
  window.location.href = loginReturnTarget();
});
document.getElementById('switch-account-btn').addEventListener('click', () => {
  clearAuthSession();
  showLoginForm();
  document.getElementById('l-email').focus();
});

document.getElementById('l-pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin();
});

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = msg;
  el.style.display = 'block';
}

async function handleLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pw    = document.getElementById('l-pw').value;
  const btn   = document.getElementById('login-btn');

  if (!email || !pw) { showError('Please enter your email and password.'); return; }

  btn.textContent = document.documentElement.lang === 'es' ? 'Iniciando sesión...' : 'Signing in...'; btn.disabled = true;
  document.getElementById('error-box').style.display = 'none';

  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw }),
    });
    const data = await res.json();

    if (!res.ok) {
      btn.textContent = document.documentElement.lang === 'es' ? 'Iniciar sesión →' : 'Sign in →'; btn.disabled = false;
      showError(data.error || 'Invalid email or password. Please try again.');
      return;
    }

    sessionStorage.setItem('mll_token', data.access_token);
    if (data.user?.id) sessionStorage.setItem('mll_user_id', data.user.id);
    else sessionStorage.removeItem('mll_user_id');
    window.location.href = loginReturnTarget();

  } catch {
    btn.textContent = document.documentElement.lang === 'es' ? 'Iniciar sesión →' : 'Sign in →'; btn.disabled = false;
    showError('Network error — please check your connection and try again.');
  }
}

async function handleForgot() {
  const email = document.getElementById('l-email').value.trim();
  if (!email) { showError('Enter your email address above first.'); return; }
  await fetch(`${API}/api/auth/reset-password`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email }),
  });
  document.getElementById('error-box').style.cssText = 'background:#E1F5EE;color:#085041;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:block;';
  document.getElementById('error-box').textContent = 'If this email exists, a reset link has been sent.';
}
</script>
