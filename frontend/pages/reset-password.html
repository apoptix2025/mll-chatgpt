<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — MyLatinoList</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { background: var(--surface-2); padding-top: var(--nav-h); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 40px 36px; width: 100%; max-width: 420px; margin: 0 20px; }
    .card-icon { font-size: 36px; margin-bottom: 16px; text-align: center; }
    .card-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--ink); text-align: center; margin-bottom: 8px; letter-spacing: -0.02em; }
    .card-sub { font-size: 14px; color: var(--ink-muted); text-align: center; margin-bottom: 28px; line-height: 1.55; }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    label { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
    input { padding: 11px 14px; border-radius: var(--radius-md); border: 1px solid var(--border-mid); font-family: var(--font-body); font-size: 14px; color: var(--ink); outline: none; }
    input:focus { border-color: var(--coral); }
    .btn { width: 100%; padding: 12px; background: var(--coral); color: #fff; border: none; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--font-body); transition: background 0.15s; margin-top: 6px; }
    .btn:hover { background: var(--coral-dark); }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .msg { font-size: 13px; padding: 10px 14px; border-radius: var(--radius-md); margin-top: 12px; text-align: center; display: none; }
    .msg.success { background: var(--teal-light); color: var(--teal-dark); display: block; }
    .msg.error { background: var(--coral-light); color: var(--coral-dark); display: block; }
    .strength { height: 3px; border-radius: 2px; margin-top: 6px; transition: all 0.3s; }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YB4TE3JXR7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YB4TE3JXR7');
  </script>
  <script src="/js/i18n.js"></script>
  <script src="/js/config.js"></script>
</head>
<body>
  <nav class="nav scrolled">
    <div class="nav-inner">
      <a href="/index.html" class="logo"><span class="logo-mark"><svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M9 1L17 6V12L9 17L1 12V6L9 1Z" fill="white"/></svg></span><span class="logo-text">my<strong>latino</strong>list</span></a>
      <div class="lang-toggle" style="margin-left:auto;">
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
        <span>|</span>
        <button class="lang-btn" data-lang="es" onclick="switchLang('es')">ES</button>
      </div>
    </div>
  </nav>

  <div class="card" id="card-reset">
    <div class="card-icon">🔐</div>
    <div class="card-title" data-en="Set new password" data-es="Crea una contraseña nueva">Set new password</div>
    <div class="card-sub" data-en="Choose a strong password for your MyLatinoList account." data-es="Elige una contraseña segura para tu cuenta de MyLatinoList.">Choose a strong password for your MyLatinoList account.</div>
    <div class="field">
      <label data-en="New password" data-es="Nueva contraseña">New password</label>
      <input id="pw1" type="password" placeholder="Min. 8 characters" data-en-ph="Min. 8 characters" data-es-ph="Mín. 8 caracteres" oninput="checkStrength()">
      <div class="strength" id="strength-bar"></div>
    </div>
    <div class="field">
      <label data-en="Confirm new password" data-es="Confirmar nueva contraseña">Confirm new password</label>
      <input id="pw2" type="password" placeholder="Repeat password" data-en-ph="Repeat password" data-es-ph="Repite la contraseña">
    </div>
    <button class="btn" id="reset-btn" onclick="doReset()">Update password →</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="card-success" style="display:none;text-align:center;">
    <div class="card-icon">✅</div>
    <div class="card-title" data-en="Password updated!" data-es="¡Contraseña actualizada!">Password updated!</div>
    <div class="card-sub" data-en="Your password has been changed successfully. You can now sign in with your new password." data-es="Tu contraseña se cambió correctamente. Ya puedes iniciar sesión con tu nueva contraseña.">Your password has been changed successfully. You can now sign in with your new password.</div>
    <a href="login.html" class="btn" style="display:block;text-decoration:none;text-align:center;margin-top:8px;" data-en="Sign in →" data-es="Iniciar sesión →">Sign in →</a>
  </div>

<script>
const API = window.MLL_CONFIG.API_URL;

// Extract tokens — Supabase puts them in hash fragment
const hash   = new URLSearchParams(window.location.hash.replace('#', ''));
const search = new URLSearchParams(window.location.search);
const accessToken  = hash.get('access_token')  || search.get('access_token');
const refreshToken = hash.get('refresh_token') || search.get('refresh_token');
const type         = hash.get('type')           || search.get('type');

// Debug — log what we got
console.log('type:', type, 'hasToken:', !!accessToken);

// If no token in URL, show error
if (!accessToken) {
  document.getElementById('msg').className = 'msg error';
  document.getElementById('msg').textContent = 'Invalid or expired reset link. Please request a new one.';
  document.getElementById('msg').style.display = 'block';
  document.getElementById('reset-btn').disabled = true;
}

function checkStrength() {
  const pw = document.getElementById('pw1').value;
  const bar = document.getElementById('strength-bar');
  if (pw.length === 0) { bar.style.width = '0'; return; }
  let score = 0;
  if (pw.length >= 8) score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const colors = ['#E24B4A','#EF9F27','#EF9F27','#1D9E75','#1D9E75'];
  const widths  = ['20%','40%','60%','80%','100%'];
  bar.style.background = colors[score-1] || '#E8E8E8';
  bar.style.width = widths[score-1] || '10%';
}

async function doReset() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('reset-btn');

  msg.className = 'msg'; msg.style.display = 'none';

  if (pw1.length < 8) { msg.className='msg error'; msg.textContent='Password must be at least 8 characters.'; return; }
  if (pw1 !== pw2)    { msg.className='msg error'; msg.textContent='Passwords do not match.'; return; }
  if (!accessToken)   { msg.className='msg error'; msg.textContent='Invalid reset link. Please request a new one.'; return; }

  btn.textContent = 'Updating...'; btn.disabled = true;

  try {
    const res = await fetch(`${API}/api/auth/update-password`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${accessToken}`,
      },
      body: JSON.stringify({ password: pw1 })
    });

    const d = await res.json();
    console.log('update-password response:', res.status, d);

    if (res.ok) {
      document.getElementById('card-reset').style.display = 'none';
      document.getElementById('card-success').style.display = 'block';
    } else {
      msg.className = 'msg error';
      msg.textContent = d.error || 'Could not update password. The link may have expired — request a new one.';
      btn.textContent = 'Update password →'; btn.disabled = false;
    }
  } catch(e) {
    msg.className = 'msg error';
    msg.textContent = 'Network error. Please try again.';
    btn.textContent = 'Update password →'; btn.disabled = false;
  }
}
</script>
  <script src="/js/nav.js"></script>
</body>
</html>
